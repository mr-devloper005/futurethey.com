services:
  ft7m4q8x2v:
    container_name: ft7m4q8x2v_app
    image: ghcr.io/mr-devloper005/futurethey.com:latest
    env_file:
      - .env
    network_mode: bridge
    restart: always
    ports:
      - "127.0.0.1:3088:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5m
      timeout: 3s
      retries: 2
